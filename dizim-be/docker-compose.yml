version: '3.8'

services:
  strapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dizim-strapi
    restart: unless-stopped
    ports:
      - '1337:1337'
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=1337
      - DATABASE_CLIENT=mysql
      - DATABASE_HOST=mysql
      - DATABASE_PORT=3306
      - DATABASE_NAME=dizim_lead_management
      - DATABASE_USERNAME=dizim
      - DATABASE_PASSWORD=dizim_password
      - DATABASE_SSL=false
      - REDIS_URL=redis://redis:6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_FROM_EMAIL=noreply@dizim.ai
      - SALES_ALERT_EMAIL=sales@dizim.ai
      - ADMIN_URL=http://localhost:1337
      - APP_KEYS=${APP_KEYS:-key1,key2,key3,key4}
      - API_TOKEN_SALT=${API_TOKEN_SALT:-salted}
      - ADMIN_JWT_SECRET=${ADMIN_JWT_SECRET:-secret}
      - TRANSFER_TOKEN_SALT=${TRANSFER_TOKEN_SALT:-salted}
    volumes:
      - ./exports:/app/exports
      - ./config:/app/config
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  mysql:
    image: mysql:8.0
    container_name: dizim-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: dizim_lead_management
      MYSQL_USER: dizim
      MYSQL_PASSWORD: dizim_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dizim-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  mysql_data:
  redis_data:
