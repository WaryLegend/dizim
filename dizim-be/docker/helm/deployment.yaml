apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.appName }}-strapi
  labels:
    app: {{ .Values.appName }}
    component: strapi
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.appName }}
      component: strapi
  template:
    metadata:
      labels:
        app: {{ .Values.appName }}
        component: strapi
    spec:
      serviceAccountName: {{ .Values.appName }}
      containers:
        - name: strapi
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 1337
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "1337"
            - name: DATABASE_CLIENT
              value: "mysql"
            - name: DATABASE_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.appName }}-db
                  key: host
            - name: DATABASE_PORT
              value: "3306"
            - name: DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.appName }}-db
                  key: name
            - name: DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.appName }}-db
                  key: username
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.appName }}-db
                  key: password
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.appName }}-redis
                  key: url
            - name: REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.appName }}-redis
                  key: host
            - name: REDIS_PORT
              value: "6379"
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.appName }}-ai
                  key: gemini-api-key
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.appName }}-email
                  key: resend-api-key
            - name: RESEND_FROM_EMAIL
              value: "noreply@dizim.ai"
            - name: SALES_ALERT_EMAIL
              value: "sales@dizim.ai"
            - name: ADMIN_URL
              value: "https://{{ .Values.domain }}"
            - name: APP_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.appName }}-strapi
                  key: app-keys
            - name: ADMIN_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.appName }}-strapi
                  key: admin-jwt-secret
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /_health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /_health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: exports
              mountPath: /app/exports
      volumes:
        - name: exports
          persistentVolumeClaim:
            claimName: {{ .Values.appName }}-exports
