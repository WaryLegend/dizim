apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.appName }}-ingress
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: {{ .Values.appName }}-ip
    networking.gke.io/managed-certificates: {{ .Values.appName }}-cert
    networking.gke.io/v1beta1.FrontendConfig: {{ .Values.appName }}-frontend
spec:
  rules:
    - host: {{ .Values.domain }}
      http:
        paths:
          - path: /*
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ .Values.appName }}-strapi
                port:
                  number: 80
